<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Registro por QR</title>

  <!-- ✅ ESTA LÍNEA ES CRÍTICA Y DEBE SER EXACTAMENTE ASÍ -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/minified/html5-qrcode.min
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 480px;
      margin: auto;
      padding: 16px;
    }
    h1 { text-align: center; }
    label { font-weight: bold; margin-top: 12px; display: block; }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      font-size: 16px;
    }
    button {
      background: #2e7d32;
      color: white;
      border: none;
      margin-top: 16px;
    }
    #reader {
      width: 100%;
      height: 300px;
      margin-top: 12px;
    }
    #status {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>📦 Registro por QR</h1>

<div id="reader"></div>

<label>Código QR</label>
<input id="qr" placeholder="Se rellena automáticamente o escribe a mano">

<label>Cantidad</label>
<input id="cantidad" type="number" min="1">

<label>OT</label>
<input id="ot">

<button onclick="guardar()">💾 Guardar</button>

<div id="status"></div>

<script>
  const API_URL =
    "https://script.google.com/macros/s/AKfycbxo5qRFWUyS2Q3K_OZfDcuxZ0r6Q9V1RvrrMarV6xJ5nNbCkw2t2sSW0ysLMNE02fK7/exec";

  function beep() {
    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    osc.connect(ctx.destination);
    osc.frequency.value = 1000;
    osc.start();
    setTimeout(() => osc.stop(), 150);
  }

  function vibrate() {
    if (navigator.vibrate) navigator.vibrate(200);
  }

  function onScanSuccess(text) {
    document.getElementById("qr").value = text;
    document.getElementById("status").innerText = "✅ QR leído";
    beep();
    vibrate();
    scanner.clear();
  }

  const scanner = new Html5QrcodeScanner(
    "reader",
    { fps: 10, rememberLastUsedCamera: true },
    false
  );

  scanner.render(onScanSuccess);

  function guardar() {
    const qr = document.getElementById("qr").value;
    const cantidad = document.getElementById("cantidad").value;
    const ot = document.getElementById("ot").value;

    if (!qr || !cantidad || !ot) {
      status.innerText = "❌ Faltan datos";
      return;
    }

    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ qr, cantidad, ot })
    })
    .then(() => {
      status.innerText = "✅ Registro guardado";
      qr.value = "";
      cantidad.value = "";
      ot.value = "";
      scanner.render(onScanSuccess);
    })
    .catch(() => {
      status.innerText = "❌ Error al guardar";
    });
  }
</script>

</body>
</html>
</body>
</html>
