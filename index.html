<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Producción CAF</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Registro de Trabajo</h1>
            <p id="global-status" class="status">Listo para registrar</p>
        </header>

        <form id="main-form">
            <div class="form-group">
                <label for="input-caf">Código CAF</label>
                <div class="input-with-action">
                    <input type="text" id="input-caf" placeholder="Escanear o escribir..." required>
                    <button type="button" id="btn-open-scanner" class="btn-icon">📷</button>
                </div>
            </div>

            <div class="form-group">
                <label for="input-cantidad">Cantidad</label>
                <input type="number" id="input-cantidad" required>
            </div>

            <div class="form-group">
                <label for="select-clase">Clase de Trabajo</label>
                <select id="select-clase">
                    <option value="PRE">PRE</option>
                    <option value="COR">COR</option>
                </select>
            </div>

            <div class="form-group">
                <label for="input-ot">OT</label>
                <input type="text" id="input-ot" required>
            </div>

            <div class="form-group">
                <label for="input-chapa">Chapa Operario</label>
                <input type="text" id="input-chapa" required>
            </div>

            <button type="submit" id="btn-submit" class="btn primary full-width">ENVIAR A GOOGLE SHEETS</button>
        </form>

        <div id="scanner-modal" class="modal" hidden>
            <div class="modal-content">
                <div class="video-wrapper">
                    <video id="qr-video" playsinline autoplay></video>
                    <canvas id="qr-canvas" hidden></canvas>
                    <div class="scan-overlay"></div>
                </div>
                <button type="button" id="btn-close-scanner" class="btn danger">Cancelar</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
