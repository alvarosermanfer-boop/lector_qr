<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registro por QR</title>

<!-- ✅ LIBRERÍA QR (ESTA LÍNEA ES CRÍTICA) -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>

<style>
  body {
    font-family: Arial, sans-serif;
    padding: 16px;
    max-width: 480px;
    margin: auto;
  }
  h1 { text-align: center; }
  label { display: block; margin-top: 12px; font-weight: bold; }
  input, button {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    margin-top: 6px;
  }
  button {
    background: #2e7d32;
    color: white;
    border: none;
    margin-top: 16px;
  }
  #reader {
    width: 100%;
    height: 300px;
    margin-top: 12px;
  }
  #status {
    margin-top: 10px;
    font-weight: bold;
  }
</style>
</head>

<body>

<h1>📦 Registro por QR</h1>

<div id="reader"></div>

<label>Código QR</label>
<input id="qr" placeholder="Se rellenará automáticamente o escribe a mano">

<label>Cantidad</label>
<input id="cantidad" type="number" min="1">

<label>OT</label>
<input id="ot">

<button onclick="guardar()">💾 Guardar</button>

<div id="status"></div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxo5qRFWUyS2Q3K_OZfDcuxZ0r6Q9V1RvrrMarV6xJ5nNbCkw2t2sSW0ysLMNE02fK7/exec";

  function beep() {
    const ctx = new AudioContext();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g);
    g.connect(ctx.destination);
    o.type = "sine";
    o.frequency.value = 1000;
    o.start();
    g.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.2);
  }

  function vibrate() {
    if (navigator.vibrate) {
      navigator.vibrate(200);
    }
  }

  function onScanSuccess(decodedText) {
    document.getElementById("qr").value = decodedText;
    document.getElementById("status").innerText = "✅ QR leído";
    beep();
    vibrate();
    scanner.clear();
  }

  const scanner = new Html5QrcodeScanner(
    "reader",
    { fps: 10, rememberLastUsedCamera: true },
    false
  );

  scanner.render(onScanSuccess);

  function guardar() {
    const qr = qr.value;
    const cantidad = cantidad.value;
    const ot = ot.value;

    if (!qr || !cantidad || !ot) {
      status.innerText = "❌ Faltan datos";
      return;
    }

    fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ qr, cantidad, ot })
    })
    .then(() => {
      status.innerText = "✅ Registro guardado";
      qr.value = "";
      cantidad.value = "";
      ot.value = "";
      scanner.render(onScanSuccess);
    })
    .catch(() => {
      status.innerText = "❌ Error al guardar";
    });
  }
</script>

</body>
</html>
