<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR Scanner PWA</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app-container">
        <header>
            <h1>Escáner QR</h1>
            <p id="status-indicator" class="status idle">Esperando acción...</p>
        </header>

        <section class="scanner-section">
            <div id="video-container">
                <video id="qr-video" playsinline autoplay hidden></video>
                <div id="scan-region-highlight" hidden></div>
            </div>
            <canvas id="qr-canvas" hidden></canvas>
            
            <div id="fallback-container" hidden>
                <p>No se pudo acceder a la cámara. Sube una imagen:</p>
                <input type="file" id="file-input" accept="image/*">
            </div>
        </section>

        <section class="controls">
            <button id="btn-start" class="btn primary">Iniciar Cámara</button>
            <button id="btn-stop" class="btn danger" hidden>Detener</button>
            <button id="btn-switch" class="btn secondary" hidden>Cambiar Cámara</button>
        </section>

        <section id="result-section" class="result-section" hidden>
            <h2>Resultado:</h2>
            <div class="result-box">
                <p id="result-text"></p>
            </div>
            <div class="result-actions">
                <button id="btn-copy" class="btn secondary">Copiar Texto</button>
                <button id="btn-open-link" class="btn primary" hidden>Abrir Enlace</button>
                <button id="btn-clear" class="btn danger">Limpiar</button>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
