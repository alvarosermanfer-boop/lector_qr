<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Prueba Cámara</title>

  <!-- ESTA LÍNEA ES CLAVE -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>
</head>

<body>

<h1>✅ Si ves este texto, el HTML carga</h1>

<button id="start">📷 Iniciar cámara</button>

<div id="reader" style="width:300px;height:300px;margin-top:10px;"></div>

<script>
  let scanner;

  document.getElementById("start").addEventListener("click", function () {
    scanner = new Html5Qrcode("reader");

    scanner.start(
      { facingMode: "environment" },
      { fps: 10 },
      function (text) {
        alert("QR leído: " + text);
        scanner.stop();
      }
    ).catch(err => {
        alert("ERROR al abrir cámara: " + err);
    });
  });
</script>

</body>
</html>
