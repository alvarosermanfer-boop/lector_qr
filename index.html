<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Escáner QR Web</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="stylesheet" href="styles.css" />

  <!-- Librería jsQR vía CDN -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>
<body>
  <header>
    <h1>📷 Escáner QR</h1>
  </header>

  <main>
    <!-- Vista previa cámara -->
    <div class="camera-container">
      <video id="video" playsinline></video>
      <canvas id="canvas" hidden></canvas>
    </div>

    <!-- Controles -->
    <div class="controls">
      <button id="startBtn">▶ Iniciar escaneo</button>
      <button id="stopBtn" disabled>⏹ Detener</button>
      <button id="torchBtn" hidden>🔦 Linterna</button>

      <select id="cameraSelect"></select>
    </div>

    <!-- Estado -->
    <p id="status" class="status">Listo</p>

    <!-- Resultado -->
    <section class="result">
      <h2>Resultado</h2>
      <textarea id="resultText" readonly placeholder="El texto del QR aparecerá aquí..."></textarea>

      <div class="result-actions">
        <button id="copyBtn">📋 Copiar</button>
        <button id="openLinkBtn" disabled>🔗 Abrir enlace</button>
        <button id="clearBtn">🧹 Limpiar</button>
      </div>
    </section>

    <!-- Fallback: subir imagen -->
    <section class="upload">
      <h3>O escanear desde una imagen</h3>
      <input type="file" id="fileInput" accept="image/*">
    </section>

    <!-- Historial -->
    <section class="history">
      <h3>Historial</h3>
      <ul id="historyList"></ul>
      <button id="clearHistoryBtn">🗑 Borrar historial</button>
    </section>
  </main>

  <footer>
    <small>Funciona solo en HTTPS · GitHub Pages ✔</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
